name: walkforward-v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/fanta_lab/backtest.py'
      - 'src/fanta_lab/backtest_v2.py'
      - 'src/fanta_lab/projection.py'
      - 'src/fanta_lab/independent_model.py'
      - 'src/fanta_lab/sources/understat.py'
      - 'src/fanta_lab/sources/fantacalcio_dev.py'
      - 'tests/test_backtest_v2.py'
      - '.github/workflows/backtest_v2.yml'

permissions:
  contents: write

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests for V2 calibration
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_backtest_v2.py tests/test_backtest.py tests/test_independent_model.py
      - name: Run nested walk-forward V2
        env:
          PYTHONPATH: src
        run: |
          mkdir -p artifacts/walkforward-v2
          python -m fanta_lab.backtest_v2 --out-dir artifacts/walkforward-v2 2>&1 | tee artifacts/walkforward-v2/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkforward-v2
          path: artifacts/walkforward-v2
          if-no-files-found: warn
      - name: Persist V2 evidence on main
        if: success()
        run: |
          mkdir -p backtests/v2
          cp artifacts/walkforward-v2/summary_v2.csv backtests/v2/summary_v2.csv
          cp artifacts/walkforward-v2/report_v2.md backtests/v2/report_v2.md
          cp artifacts/walkforward-v2/metadata_v2.json backtests/v2/metadata_v2.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backtests/v2
          git diff --cached --quiet || git commit -m 'chore(backtest): persist V2 walk-forward evidence'
          git pull --rebase origin main
          git push origin main
